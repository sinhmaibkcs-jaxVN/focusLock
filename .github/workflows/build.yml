name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen project
        run: unzip -q FocusLock.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: FocusLock
      - uses: actions/upload-artifact@v4
        with:
          name: FocusLock-apk
          path: FocusLock/app/build/outputs/apk/debug/app-debug.apk
